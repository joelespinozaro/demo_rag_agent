# Config de Cloud Build para 01_agent-app (ver DEPLOYMENT.md, Fase 5).
#
# Por qué existe este archivo: el build necesita 4 --build-arg (las
# NEXT_PUBLIC_* que Next.js hornea dentro del bundle de JS en build-time,
# ver Dockerfile) — y `gcloud builds submit --tag` (el atajo que usan las
# Fases 2.2 y 3.2, que no llevan build-args) no soporta pasar --build-arg.
# Este archivo describe el mismo `docker build` explícitamente para poder
# inyectarlos vía --substitutions en el comando de gcloud.
steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      - build
      - "--build-arg=NEXT_PUBLIC_API_BASE=https://${_GATEWAY_HOST}"
      - "--build-arg=NEXT_PUBLIC_FIREBASE_API_KEY=${_FIREBASE_API_KEY}"
      - "--build-arg=NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}"
      - "--build-arg=NEXT_PUBLIC_FIREBASE_PROJECT_ID=${_FIREBASE_PROJECT_ID}"
      - "-t=${_IMAGE}"
      - .
images:
  - "${_IMAGE}"
